<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Engagement Early-Warning System evaluation checklist</title>
<desc id="desc">Checklist for temporal leakage, calibration, capacity-constrained support metrics, lead time, subgroup diagnostics, and intervention governance.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Engagement Early-Warning System · evaluation checklist</text>
<text x="60" y="99" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">The current repository computes synthetic diagnostics; it does not claim a validated production model.</text>

<rect x="60" y="140" width="330" height="130" rx="18" fill="#E8F1F3" stroke="#87949A"/>
<text x="82" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Temporal leakage</text>
<text x="82" y="203" font-family="Arial" font-size="14" fill="#26343B">Were all features actually available</text>
<text x="82" y="225" font-family="Arial" font-size="14" fill="#26343B">at the prediction cutoff?</text>

<rect x="435" y="140" width="330" height="130" rx="18" fill="#EEF3E8" stroke="#87949A"/>
<text x="457" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Calibration</text>
<text x="457" y="203" font-family="Arial" font-size="14" fill="#26343B">Brier score, reliability bins, and</text>
<text x="457" y="225" font-family="Arial" font-size="14" fill="#26343B">ECE on a later holdout.</text>

<rect x="810" y="140" width="330" height="130" rx="18" fill="#F5EDE4" stroke="#87949A"/>
<text x="832" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Review capacity</text>
<text x="832" y="203" font-family="Arial" font-size="14" fill="#26343B">Precision and recall at the number</text>
<text x="832" y="225" font-family="Arial" font-size="14" fill="#26343B">of cases staff can actually review.</text>

<rect x="60" y="305" width="330" height="130" rx="18" fill="#ECE8F5" stroke="#87949A"/>
<text x="82" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Lead time</text>
<text x="82" y="368" font-family="Arial" font-size="14" fill="#26343B">Does a selected true-positive case</text>
<text x="82" y="390" font-family="Arial" font-size="14" fill="#26343B">leave enough time for useful support?</text>

<rect x="435" y="305" width="330" height="130" rx="18" fill="#F4EFE8" stroke="#87949A"/>
<text x="457" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Subgroup diagnostics</text>
<text x="457" y="368" font-family="Arial" font-size="14" fill="#26343B">Inspect selection, errors, Brier,</text>
<text x="457" y="390" font-family="Arial" font-size="14" fill="#26343B">and calibration by relevant context.</text>

<rect x="810" y="305" width="330" height="130" rx="18" fill="#EAF0EC" stroke="#87949A"/>
<text x="832" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Support governance</text>
<text x="832" y="368" font-family="Arial" font-size="14" fill="#26343B">Review outcomes, repeat-alert rules,</text>
<text x="832" y="390" font-family="Arial" font-size="14" fill="#26343B">privacy, and intervention effects.</text>

<text x="60" y="488" font-family="Arial" font-size="15" fill="#5B6660">A model can rank well and still be too late, poorly calibrated, unfairly deployed, or operationally unusable.</text>
</svg>